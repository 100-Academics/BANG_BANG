[project]
name = "bang-bang"
version = "0.1.0"
description = "NBA player + team projection model (1 month to end of season)"
requires-python = ">=3.11"
dependencies = [
    "nba-api>=1.6.0",
    "polars>=1.0",
    "requests>=2.31",
    "scikit-learn>=1.4",
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=25.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bang_bang"]

[tool.pytest.ini_options]
testpaths = ["tests"]
